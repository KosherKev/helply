            - string
            - "null"
        trace:
          type: array
          items:
            $ref: "#/components/schemas/TraceStep"
        conversationId:
          type: string
        messageId:
          type: string
        handledBy:
          type: string
          enum:
            - ai
            - human
        held:
          type: boolean
      required:
        - verified
        - user
        - requiresAuth
        - needsHuman
        - understanding
        - reply
        - roundTrip
        - evidence
        - rootCause
        - ticketId
        - trace
