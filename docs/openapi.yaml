  /v1/identity/key:
    get:
      tags:
        - Connections
      summary: Customer-token verification mode and public key
      operationId: get_v1_identity_key
      security:
        - sessionAuth: []
      x-min-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityKey"
        "401":
          description: No or invalid credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role or scope not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Connections
      summary: Go back to shared-secret verification
      operationId: delete_v1_identity_key
      security:
        - sessionAuth: []
      x-min-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityKey"
        "401":
          description: No or invalid credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role or scope not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - Connections
      summary: Switch to public-key verification (RS256/ES256, PEM or JWKS URL)
      operationId: put_v1_identity_key
      security:
        - sessionAuth: []
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alg:
                  type: string
                  enum:
                    - RS256
                    - ES256
                publicKeyPem:
                  type:
                    - string
                    - "null"
                jwksUrl:
                  type:
                    - string
                    - "null"
                kid:
                  type:
                    - string
                    - "null"
              required:
                - alg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityKey"
        "401":
          description: No or invalid credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role or scope not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
