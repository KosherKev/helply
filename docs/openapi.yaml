      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: Opaque session token from /v1/auth/login (12h).
    apiKeyAuth:
      type: http
      scheme: bearer
      description: hk_live_... workspace API key; scopes limit what it can reach.
    relayAuth:
      type: http
      scheme: bearer
      description: hr_live_... channel relay key, held by a connected ChatFlow server (PLANNED).
    consoleKey:
      type: apiKey
      in: header
      name: X-Console-Key
      description: Legacy single-workspace key (default workspace only).
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        requestId:
          type: string
      required:
        - error
    LogLine:
      type: object
      properties:
        id:
          type: string
        time:
          type: string
        level:
          type: string
          enum:
            - info
            - warn
            - error
            - debug
        method:
          type:
            - string
            - "null"
        path:
          type:
            - string
            - "null"
        status:
          type:
            - integer
            - "null"
        durationMs:
          type:
            - integer
            - "null"
        traceId:
          type:
            - string
            - "null"
        error:
          type:
            - object
            - "null"
          properties:
            message:
              type: string
            code:
              type:
                - string
                - "null"
          required:
            - message
            - code
        response:
          type:
            - string
            - "null"
      required:
        - id
        - time
        - level
        - method
        - path
        - status
        - durationMs
        - traceId
        - error
        - response
    TraceStep:
      type: object
      properties:
        step:
          type: string
          enum:
            - identity
            - understand
            - translate_in
            - logs
            - explain
            - knowledge
            - translate_out
            - done
        ms:
          type: number
      required:
        - step
        - ms
      additionalProperties: true
    RootCause:
      type: object
      properties:
        summary:
          type: string
        suggestedFix:
          type: string
        citedLines:
          type: array
          items:
            type: string
        confidence:
          type: number
      required:
        - summary
        - suggestedFix
        - citedLines
        - confidence
    RoundTrip:
      type: object
      properties:
        backTranslation:
          type: string
        similarity:
          type: number
        reviewRecommended:
          type: boolean
        provider:
          type: string
          enum:
            - khaya
            - gemma
            - none
      required:
        - backTranslation
        - similarity
        - reviewRecommended
        - provider
    Understanding:
      type: object
      properties:
        language:
          type: string
          enum:
            - en
            - tw
            - gaa
            - ee
            - fat
            - dag
            - pcm
        languageName:
          type: string
        english:
          type: string
        intent:
          type: string
          enum:
            - general_question
            - account_issue
            - human_request
            - other
      required:
        - language
        - languageName
        - english
        - intent
    SupportResponse:
      type: object
      properties:
        verified:
          type: boolean
        user:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
            name:
              type:
                - string
                - "null"
          required:
            - id
            - name
        requiresAuth:
          type: boolean
        needsHuman:
          type: boolean
        understanding:
          $ref: "#/components/schemas/Understanding"
        reply:
          type: object
          properties:
            language:
              type: string
              enum:
                - en
                - tw
                - gaa
                - ee
                - fat
                - dag
                - pcm
            english:
              type: string
            text:
              type: string
          required:
            - language
            - english
            - text
        roundTrip:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RoundTrip"
        evidence:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/LogLine"
        rootCause:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RootCause"
        ticketId:
          type:
            - string
            - "null"
        trace:
          type: array
          items:
            $ref: "#/components/schemas/TraceStep"
        conversationId:
          type: string
        messageId:
          type: string
        handledBy:
          type: string
          enum:
            - ai
            - human
        held:
          type: boolean
      required:
        - verified
        - user
        - requiresAuth
        - needsHuman
        - understanding
        - reply
        - roundTrip
        - evidence
        - rootCause
        - ticketId
        - trace
        - conversationId
        - messageId
        - handledBy
    VoiceResponse:
      allOf:
        - $ref: "#/components/schemas/SupportResponse"
        - type: object
          properties:
            transcript:
              type: string
            replyAudio:
              type:
                - object
                - "null"
              properties:
                mimeType:
                  type: string
                base64:
                  type: string
              required:
                - mimeType
                - base64
          required:
            - transcript
            - replyAudio
    Ticket:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        status:
          type: string
          enum:
            - open
            - needs_human
            - resolved
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        assigneeId:
          type:
            - string
            - "null"
        conversationId:
          type:
            - string
            - "null"
        title:
          type: string
        userId:
          type:
            - string
            - "null"
        language:
          type: string
          enum:
            - en
            - tw
            - gaa
            - ee
            - fat
            - dag
            - pcm
        customerMessage:
          type: string
        replyEnglish:
          type: string
        rootCause:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RootCause"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
      required:
        - id
        - createdAt
        - updatedAt
        - status
        - priority
        - assigneeId
        - conversationId
        - title
        - userId
        - language
        - customerMessage
        - replyEnglish
        - rootCause
        - evidence
    TicketPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - tickets
        - nextCursor
    Note:
      type: object
      properties:
        id:
          type: string
        ticketId:
          type: string
        authorId:
          type:
            - string
            - "null"
        text:
          type: string
        createdAt:
          type: string
      required:
        - id
        - ticketId
        - authorId
        - text
        - createdAt
    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum:
            - customer
            - ai
            - agent
        text:
          type: string
        english:
          type:
            - string
            - "null"
        language:
          type:
            - string
            - "null"
        intent:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - sent
            - pending_review
            - rejected
        reviewRecommended:
          type: boolean
        meta:
          type: object
          additionalProperties: true
        authorId:
          type:
            - string
            - "null"
        createdAt:
          type: string
      required:
        - id
        - conversationId
        - role
        - text
        - english
        - language
        - intent
        - status
        - reviewRecommended
        - meta
        - authorId
        - createdAt
    Conversation:
      type: object
      properties:
        id:
          type: string
        customerId:
          type:
            - string
            - "null"
        customerName:
          type:
            - string
            - "null"
        language:
          type: string
          enum:
            - en
            - tw
            - gaa
            - ee
            - fat
            - dag
            - pcm
        status:
          type: string
          enum:
            - ai
            - needs_human
            - human
            - resolved
        handedOff:
          type: boolean
        assigneeId:
          type:
            - string
            - "null"
        firstResponseMs:
          type:
            - integer
            - "null"
        createdAt:
          type: string
        updatedAt:
          type: string
        lastMessage:
          type:
            - string
            - "null"
        messageCount:
          type: integer
      required:
        - id
        - customerId
        - customerName
        - language
        - status
        - handedOff
        - assigneeId
        - firstResponseMs
        - createdAt
        - updatedAt
    ConversationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            ticketIds:
              type: array
              items:
                type: string
          required:
            - messages
            - ticketIds
    AgentReplyResult:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/Message"
        roundTrip:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RoundTrip"
        held:
          type: boolean
      required:
        - message
        - roundTrip
        - held
    TranslationPreview:
      type: object
      properties:
        text:
          type: string
        english:
          type: string
        roundTrip:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RoundTrip"
      required:
        - text
        - english
        - roundTrip
    PendingReply:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum:
            - ai
            - agent
        text:
          type: string
        english:
          type:
            - string
            - "null"
        language:
          type:
            - string
            - "null"
        roundTrip:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RoundTrip"
        customerMessage:
          type:
            - string
            - "null"
        createdAt:
