components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: Opaque session token from /v1/auth/login (12h).
    apiKeyAuth:
      type: http
      scheme: bearer
      description: hk_live_... workspace API key; scopes limit what it can reach.
    consoleKey:
      type: apiKey
      in: header
      name: X-Console-Key
      description: Legacy single-workspace key (default workspace only).
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        requestId:
          type: string
      required:
        - error
    LogLine:
      type: object
      properties:
        id:
          type: string
        time:
          type: string
        level:
          type: string
          enum:
            - info
            - warn
            - error
            - debug
        method:
          type:
            - string
            - "null"
        path:
          type:
            - string
            - "null"
        status:
          type:
            - integer
            - "null"
        durationMs:
          type:
            - integer
            - "null"
        traceId:
          type:
            - string
            - "null"
        error:
          type:
            - object
            - "null"
          properties:
            message:
              type: string
            code:
              type:
                - string
                - "null"
          required:
            - message
            - code
        response:
          type:
            - string
            - "null"
      required:
        - id
        - time
        - level
        - method
        - path
        - status
        - durationMs
        - traceId
        - error
        - response
    TraceStep:
      type: object
      properties:
        step:
          type: string
          enum:
            - identity
            - understand
            - translate_in
            - logs
            - explain
            - knowledge
            - translate_out
            - done
        ms:
          type: number
      required:
        - step
        - ms
      additionalProperties: true
    RootCause:
      type: object
      properties:
        summary:
          type: string
        suggestedFix:
          type: string
        citedLines:
          type: array
          items:
            type: string
        confidence:
          type: number
      required:
        - summary
        - suggestedFix
        - citedLines
        - confidence
    RoundTrip:
      type: object
      properties:
        backTranslation:
          type: string
        similarity:
          type: number
        reviewRecommended:
          type: boolean
        provider:
          type: string
          enum:
            - khaya
            - gemma
            - none
      required:
        - backTranslation
        - similarity
        - reviewRecommended
        - provider
    Understanding:
      type: object
      properties:
        language:
          type: string
          enum:
            - en
            - tw
            - gaa
            - ee
            - fat
            - dag
            - pcm
        languageName:
          type: string
        english:
          type: string
        intent:
          type: string
          enum:
            - general_question
            - account_issue
            - human_request
            - other
      required:
        - language
        - languageName
        - english
        - intent
    SupportResponse:
      type: object
      properties:
        verified:
          type: boolean
        user:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
            name:
              type:
                - string
                - "null"
          required:
            - id
            - name
        requiresAuth:
          type: boolean
        needsHuman:
          type: boolean
        understanding:
          $ref: "#/components/schemas/Understanding"
        reply:
          type: object
          properties:
            language:
              type: string
              enum:
                - en
                - tw
                - gaa
                - ee
                - fat
                - dag
                - pcm
            english:
              type: string
            text:
              type: string
          required:
            - language
            - english
            - text
        roundTrip:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RoundTrip"
        evidence:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/LogLine"
        rootCause:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RootCause"
        ticketId:
